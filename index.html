<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tangkap Kotak</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 500px;
            height: 400px;
            background-color: #34495e;
            border: 4px solid #ecf0f1;
            border-radius: 10px;
            cursor: crosshair;
        }

        #player {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #e74c3c;
            border-radius: 5px;
            transition: 0.1s;
        }

        .stats {
            margin-bottom: 10px;
            font-size: 24px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>

    <div class="stats">Skor: <span id="score">0</span></div>
    
    <div id="game-container">
        <div id="player"></div>
    </div>

    <button onclick="resetGame()">Reset Game</button>

    <script>
        const player = document.getElementById('player');
        const container = document.getElementById('game-container');
        const scoreElement = document.getElementById('score');
        
        let score = 0;

        // Fungsi untuk memindahkan kotak ke posisi acak
        function moveSquare() {
            // Hitung batas maksimal agar kotak tidak keluar dari kontainer
            const maxX = container.clientWidth - player.clientWidth;
            const maxY = container.clientHeight - player.clientHeight;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            player.style.left = randomX + 'px';
            player.style.top = randomY + 'px';
        }

        // Event saat kotak diklik
        player.addEventListener('mousedown', function() {
            score++;
            scoreElement.innerText = score;
            
            // Ubah warna acak setiap kali diklik
            const colors = ['#e74c3c', '#f1c40f', '#9b59b6', '#3498db', '#1abc9c'];
            player.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            moveSquare();
        });

        // Fungsi untuk mereset skor
        function resetGame() {
            score = 0;
            scoreElement.innerText = score;
            moveSquare();
        }

        // Mulai posisi pertama
        moveSquare();
    </script>
</body>
</html>
